# Produktion på bibliotekarien-vps (standalone, room40/markrounding-mönstret):
#
#   internet ──▶ edge-Caddy (/opt/bibliotekarien-platform/edge)
#                    │  joinar teaball_proxy som external network
#                    │
#        allt ──────▶ teaball-anubis:8923 ──▶ teaball-web:8000
#                          (PoW-gate — all trafik är browsertrafik,
#                           htmx-anropen bär clearance-cookien)
#                                   │
#                                   ▼
#                       teaball-data (named volume, SQLite)
#
# Inga host-portar publiceras — edge når containrarna via nätverket.
# Lokal utveckling använder docker-compose.yml i stället.
# Bring-up: sudo /opt/teaball/app/scripts/deploy.sh
name: teaball

services:
  web:
    build: .
    image: teaball:latest
    container_name: teaball-web
    networks: [proxy]
    volumes:
      - teaball-data:/data
    environment:
      DB_PATH: /data/teaball.db
      SECRET_KEY: ${SECRET_KEY:?Sätt SECRET_KEY i .env}
      COOKIE_SECURE: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Sätt PUBLIC_BASE_URL i .env}
      # Instansens texter ligger i databasen (Inställningar i appen). De här
      # fyller den bara EN gång, vid första start efter migration 0010, så att
      # instansen behåller sina texter vid uppgraderingen. Därefter läses de
      # inte, och de kan tas bort när den deployen är gjord.
      ORGANISATION: ${ORGANISATION:-DiVA-konsortiet}
      NUVARANDE_SYSTEM: ${NUVARANDE_SYSTEM:-DiVA Classic}
      PERSONUPPGIFTSANSVARIG: ${PERSONUPPGIFTSANSVARIG:-}
      DATASKYDD_KONTAKT: ${DATASKYDD_KONTAKT:-}
      # Anubis står framför appen och sätter en egen kaka — integritetssidan
      # ska nämna den.
      ROBOTSKYDD: "1"
      # Server-side Matomo (Tracking HTTP API) — tomma värden stänger av.
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
      MATOMO_TOKEN: ${MATOMO_TOKEN:-}
    healthcheck:
      # python i stället för curl — curl finns inte i python:3.12-slim.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  anubis:
    # Pinnad som tagg@digest (samma version som övriga appar) — med :latest
    # kan Anubis-versionen bytas oannonserat vid pull. Taggen säger vilken
    # release som avses, digesten är vad som hämtas. Edge-Caddyfilens CSP för
    # teaball.bibliotekarien.se är kopplad till hur den här versionen
    # laddar sin PoW-worker (blob:); bumpa version och CSP ihop, i takt med de
    # andra apparna (bibliotekarien-platform edge/ANUBIS.md, "Uppgradera
    # Anubis").
    image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
    container_name: teaball-anubis
    depends_on: [web]
    networks: [proxy]
    environment:
      BIND: ":8923"
      TARGET: "http://web:8000"
      # Anubis egen standardpolicy (ingen POLICY_FNAME), enligt
      # bibliotekarien-platform edge/ANUBIS.md. Vår egen policy ersatte den och
      # utmanade allt med "Mozilla" — samma mönster som stängde ute Google från
      # de andra apparna. Ingen DIFFICULTY (standardpolicyns trösklar styr) och
      # ingen SERVE_ROBOTS_TXT: robots.txt serveras av appen (app/main.py) —
      # teaball är stängd för sökmotorer, men som ett nedskrivet beslut, inte
      # för att Anubis råkar servera `Disallow: /`.
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: 24h
      # Måste matcha det publika hostnamnet, annars accepteras inte
      # clearance-cookien (samma fallgrop som i tOPAC/markrounding).
      COOKIE_DOMAIN: ${ANUBIS_COOKIE_DOMAIN:?Sätt ANUBIS_COOKIE_DOMAIN i .env}
      METRICS_BIND: ":9090"
      CHALLENGE_TITLE: "Teaball"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  # Docker döper detta till `teaball_proxy` (projekt `teaball` +
  # nyckel `proxy`). Edge-Caddy joinar det som external network.
  proxy:
    driver: bridge

volumes:
  teaball-data:
