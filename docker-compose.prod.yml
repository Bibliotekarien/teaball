# Produktion på bibliotekarien-vps (standalone, room40/markrounding-mönstret):
#
#   internet ──▶ edge-Caddy (/opt/bibliotekarien-platform/edge)
#                    │  joinar teaball_proxy som external network
#                    │
#        allt ──────▶ teaball-web:8000
#                          │
#                          ▼
#              teaball-data (named volume, SQLite per
#              organisation under organisationer/)
#
# Ingen Anubis, med avsikt: utan konto når man bara inloggningen,
# /integritet, robots.txt, statiska filer och hemliga /svara/<token>-länkar,
# så det finns inget att skrapa. Lösenordsgissning bromsas av appens spärr
# per IP och användarnamn (app/routers/inloggning.py). Anubis släppte ändå
# igenom skript utan webbläsar-user-agent. Bakgrund i bibliotekarien-platform
# edge/ANUBIS.md.
#
# Inga host-portar publiceras — edge når containern via nätverket.
# Lokal utveckling använder docker-compose.yml i stället.
# Bring-up: sudo /opt/teaball/app/scripts/deploy.sh
name: teaball

services:
  web:
    build: .
    image: teaball:latest
    container_name: teaball-web
    networks: [proxy]
    volumes:
      - teaball-data:/data
    environment:
      # En databas per organisation, vald på hostnamnet (INSTALL.md avsnitt
      # 10): /data/organisationer/teaball.bibliotekarien.se.db. Svarslänkarna
      # byggs på anropets egen adress, så PUBLIC_BASE_URL behövs inte, och
      # instansens texter ändras under Inställningar i appen.
      ORGANISATIONER_DIR: /data/organisationer
      SECRET_KEY: ${SECRET_KEY:?Sätt SECRET_KEY i .env}
      COOKIE_SECURE: "1"
      # Server-side Matomo (Tracking HTTP API). Sajten sätts per organisation
      # med scripts/organisationer.py matomo; MATOMO_SITE_ID används inte.
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_TOKEN: ${MATOMO_TOKEN:-}
    healthcheck:
      # python i stället för curl — curl finns inte i python:3.12-slim.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

networks:
  # Docker döper detta till `teaball_proxy` (projekt `teaball` +
  # nyckel `proxy`). Edge-Caddy joinar det som external network.
  proxy:
    driver: bridge

volumes:
  teaball-data:
