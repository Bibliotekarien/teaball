{% extends "base.html" %}
{% block titel %}Ta bort konto – Teaball{% endblock %}
{% block innehall %}
<div class="mx-auto max-w-md rounded-lg border border-rose-200 bg-rose-50 p-4 text-sm">
  <p class="mb-3 text-rose-900">
    <strong>Ta bort kontot ”{{ anvandarnamn }}” ({{ roll }})?</strong>
    Kontot loggas ut direkt och kan inte logga in igen. Inget annat påverkas —
    kontot äger ingen data i systemet.
  </p>
  <form method="post" action="/konton/{{ konto_id }}/ta-bort" class="flex gap-2">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <button class="rounded-md bg-rose-700 px-3 py-1.5 text-white hover:bg-rose-800">Ta bort</button>
    <a href="/konton" class="rounded-md border border-stone-300 px-3 py-1.5 hover:bg-stone-100">Avbryt</a>
  </form>
</div>
{% endblock %}
