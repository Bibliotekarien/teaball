{% extends "base.html" %}
{% block titel %}Bedömning – Teaball{% endblock %}
{% block huvudskript %}
<script src="{{ static_url('js/trad.js') }}" defer></script>
{% endblock %}
{% block innehall %}
<form method="get" action="/bedomning" class="mb-4 flex flex-wrap items-center gap-3 text-sm">
  <label for="medlem" class="text-stone-600">{% if skrivbar %}Svarar som (proxy):{% else %}Visar svar för:{% endif %}</label>
  <select id="medlem" name="medlem_id" data-autosubmit
          class="rounded-md border border-stone-300 bg-white px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700">
    {% for m in medlemmar %}
    <option value="{{ m.id }}" {% if m.id == vald %}selected{% endif %}>{{ m.namn }}</option>
    {% endfor %}
  </select>
  <label class="flex cursor-pointer items-center gap-1.5 text-stone-600">
    <input type="checkbox" name="dolj_bedomda" value="1" data-autosubmit {% if dolj_bedomda %}checked{% endif %}>
    Dölj bedömda
  </label>
  <label class="flex cursor-pointer items-center gap-1.5 text-stone-600">
    <input type="checkbox" name="dolj_driftsatta" value="1" data-autosubmit {% if dolj_driftsatta %}checked{% endif %}>
    Dölj driftsatta
  </label>
  <label class="flex cursor-pointer items-center gap-1.5 text-stone-600">
    <input type="checkbox" name="dolj_formagor" value="1" data-autosubmit {% if dolj_formagor %}checked{% endif %}>
    Dölj förmågor
  </label>
  <noscript><button class="rounded-md border border-stone-300 px-3 py-1 hover:bg-stone-100">Välj</button></noscript>
</form>

{% if not medlemmar %}
<p class="rounded-md border border-stone-200 bg-white p-4 text-sm text-stone-500">
  Inga medlemmar ännu — lägg till dem under <a href="/medlemmar" class="text-blue-800 underline">Medlemmar</a>.
</p>
{% else %}
{% include "bedomning/_innehall.html" %}
{% endif %}
{% endblock %}
