{% extends "base.html" %}
{% block titel %}Logga in – Teaball{% endblock %}
{% block innehall %}
<div class="mx-auto mt-10 max-w-sm rounded-lg border border-stone-200 bg-white p-6">
  <h2 class="mb-4 font-serif text-lg text-blue-900">Logga in</h2>
  {% if fel %}
  <div class="mb-3 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800">{{ fel }}</div>
  {% endif %}
  <form method="post" action="/login" class="grid gap-3 text-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label class="grid gap-1">Användarnamn
      <input name="anvandarnamn" required autofocus autocomplete="username"
             class="rounded-md border border-stone-300 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-700">
    </label>
    <label class="grid gap-1">Lösenord
      <input type="password" name="losenord" required autocomplete="current-password"
             class="rounded-md border border-stone-300 px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-700">
    </label>
    <button class="mt-1 rounded-md bg-blue-900 py-2 text-white hover:bg-blue-800">Logga in</button>
  </form>
</div>
{% endblock %}
