<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap – Teaball</title>
<style>
  /* Self-contained (R2): inline CSS only, no scripts. */
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c1917;
         background: #fafaf9; margin: 0; padding: 2rem 1rem; }
  main { max-width: 52rem; margin: 0 auto; }
  h1 { font-family: Georgia, serif; color: #1e3a8a; font-size: 1.25rem;
       border-bottom: 2px solid #1e3a8a; padding-bottom: .5rem; }
  .meta { color: #78716c; font-size: .75rem; margin-bottom: 1.5rem; }
  h2 { font-family: Georgia, serif; color: #1e3a8a; font-size: .9rem; margin: 1.25rem 0 .25rem; }
  .grupp { background: #fff; border: 1px solid #e7e5e4; border-radius: .5rem; }
  .rad { display: flex; align-items: center; gap: .5rem; padding: .3rem .5rem;
         border-bottom: 1px solid #f5f5f4; font-size: .85rem; }
  .rad:last-child { border-bottom: none; }
  .namn { flex: 1; }
  .formaga { color: #1e3a8a; font-weight: 600; }
  .funktion { color: #292524; font-weight: 500; }
  .krav { color: #44403c; }
  .badge { border-radius: .25rem; padding: .1rem .4rem; font-size: .7rem; white-space: nowrap; }
  .typ { background: #f5f5f4; color: #78716c; }
  .status-driftsatt { background: #d1fae5; color: #065f46; }
  .status-planerad { background: #e0f2fe; color: #075985; }
  .status-idé { background: #e7e5e4; color: #57534e; }
  .status-utreds { background: #fef3c7; color: #92400e; }
  .status-utgår { background: #f5f5f4; color: #a8a29e; text-decoration: line-through; }
</style>
</head>
<body>
<main>
  <h1>Teaball – roadmap</h1>
  <p class="meta">Genererad {{ genererad }}.</p>
  {% for fas, rader in grupper %}
  <h2>{{ fas }}</h2>
  <div class="grupp">
    {% for n in rader %}
    <div class="rad" style="padding-left: {{ n.djup * 18 + 8 }}px">
      <span class="namn {{ {'förmåga': 'formaga', 'funktion': 'funktion', 'krav': 'krav'}[n.typ] }}">{{ n.namn }}</span>
      <span class="badge typ">{{ TYP_LABEL[n.typ] }}</span>
      {% if n.typ != 'förmåga' %}<span class="badge status-{{ n.status }}">{{ n.status }}</span>{% endif %}
    </div>
    {% endfor %}
  </div>
  {% endfor %}
</main>
</body>
</html>
