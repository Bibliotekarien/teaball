[project]
name = "teaball"
version = "0.1.0"
description = "Kravdatabas och förmågekarta (see requirements.md)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "openpyxl>=3.1.5",
    "httpx>=0.27",
    "weasyprint>=63",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "coverage>=7.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: performance tests against the seeded large dataset"]

# Täckning mäts i CI (tests.yml, jobbet coverage) och lokalt med
#   uv run coverage run -m pytest && uv run coverage report
[tool.coverage.run]
branch = true
source = ["app", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Golvet ligger strax under nuvarande nivå (91 %): det fångar en PR som lägger
# till otestad kod i större mängd, utan att varje liten refaktor blir röd.
fail_under = 90
