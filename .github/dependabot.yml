version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor/patch samlas i en PR per vecka och ekosystem. Huvudversioner
    # kommer var för sig och läses innan merge.
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Python-versionen byts för hand, ihop med .python-version (regeln
    # "Python-version" i bibliotekarien-platform/.github/README.md).
    # Digest-bumpar inom 3.12 kommer fortfarande.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # En PR för ghcr.io/techarohq/anubis är signalen att köra Anubis-checklistan
  # i bibliotekarien-platform/edge/ANUBIS.md (edge-CSP/blob-worker,
  # robots-mallen, policykontrollen) i alla appar samtidigt. Merga inte en
  # ensam image-bump. Ingen ignore: varje ny version ska ge en påminnelse.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
