version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor/patch samlas i en PR per vecka och ekosystem. Huvudversioner
    # kommer var för sig och läses innan merge.
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Pythons runtime byts för hand, tillsammans med .python-version — se
    # "Python-version" i bibliotekarien-platform/.github/README.md. Patchar
    # inom samma minor kommer som ny digest.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # De SHA-pinnade actions i .github/workflows. Bumpades tidigare i
  # bibliotekarien-platform, när jobben låg där.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
