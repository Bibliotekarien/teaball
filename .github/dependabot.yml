version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Minor/patch samlas i en PR per vecka och ekosystem. Huvudversioner
    # kommer var för sig och läses innan merge.
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  # Bevakar uses-raderna i .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # En PR för ghcr.io/techarohq/anubis är signalen att köra Anubis-checklistan
  # i bibliotekarien-platform/edge/ANUBIS.md (edge-CSP/blob-worker,
  # robots-mallen, policykontrollen) i alla appar samtidigt. Merga inte en
  # ensam image-bump. Ingen ignore: varje ny version ska ge en påminnelse.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
